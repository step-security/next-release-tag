name: Test
on:
  pull_request:
    types: [opened, reopened]
    branches-ignore:
      - 'dependabot-updates'
  push:
    branches-ignore:
      - 'main'
      - 'dependabot/**'

permissions:
  contents: read

jobs:
  Test:
    name: OS ${{ matrix.os }} + node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: ${{ github.actor == 'dependabot[bot]' && fromJSON('["24"]') || fromJSON('["24", "22""]') }}
        os: ${{ github.actor == 'dependabot[bot]' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sanity testing of the action
        id: generate_release_tag
        uses: ./
        with:
          tag_prefix: 'v'
          tag_template: 'yy.mm.i'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Manually check release tag
        run: echo "${{ steps.generate_release_tag.outputs.next_release_tag }}"
